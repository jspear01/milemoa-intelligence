name: Scheduled MileMoa Scraper & Sync

on:
  schedule:
    # Runs twice a day at 00:00 and 12:00 UTC
    - cron: '0 0,12 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run incremental scrape and summarization
        run: python run.py sync

      - name: Commit and push updated database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/milemoa.db .state/checkpoint.json STATUS.md
          if git diff --staged --quiet; then
            echo "No new posts or changes to commit."
          else
            git commit -m "chore(data): auto-sync recent deals [skip ci]"
            git push
          fi
